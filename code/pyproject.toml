# ============================================================
#  code/ -- every listing, every exercise and every measurement in the book,
#  as one uv project locked to the versions on the title page.
#
#  The pins here are the SAME versions preamble.tex prints; the build's
#  `versions` job compares both against PyPI on every push, and
#  tools/check_structure.py --pins fails when the two disagree with each
#  other. Change a version in both places or in neither.
#
#  Run from this directory:
#      uv sync --locked          # the environment, exactly as CI has it
#      PYBOOK_SOLUTIONS=1 uv run pytest   # every listing, every exercise SOLUTION
#      PYBOOK_STARTERS=fail uv run pytest exercises   # every starter must fail
#      uv run ruff check .       # lint, 79 columns, because the page is
#      uv run pyright            # the checker the book pins first
# ============================================================
[project]
name = "python-for-dotnet-engineers"
version = "0.1.0.dev0"
description = "Listings, exercises and measurements for Python for .NET Engineers"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sqlalchemy==2.0.52",
    "alembic==1.20.0",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "opentelemetry-sdk==1.44.0",
    "polars==1.44.2",
    "anthropic==1.5.0",
    "openai==3.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.168.0",
    "ruff==0.16.7",
    "pyright==1.1.414",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# The one package this project builds is the guiding project. Listings and
# exercises are plain files, run by tests, and are not packaged.
[tool.uv.build-backend]
module-name = "trace_assert"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "exercises"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
# 79, not 88: that is what fits a listing on the page at \footnotesize without
# wrapping, and tools/check_structure.py --lines holds every file here to it.
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "ch*", "measure", "tests", "exercises"]
# "ch*" rather than the exact chapter list, deliberately: pyright's
# glob matches ch00 through ch14 as they arrive. A hard-coded "ch00"
# left every future chapter's listings out of strict type-checking
# while the CI step stayed green -- proved on a scratch ch01/probe.py.

# A measurement script imports the chapter's own listings rather than a
# copy of them, and a listing is a SCRIPT: it imports its siblings by bare
# name, which is what the reader typing `uv run python ch10/nplusone.py`
# gets. pyright searches the file's own directory, so that resolves inside
# ch10/ and not from measure/. This names the chapter directories the
# measurement scripts reach into; add one when a chapter's measurement
# does -- ch13 is here because E8 times the corpus that ch13's
# what_survives.py prints, rather than carrying a second copy of it.
# "." is code/ itself, and it is what lets a measurement script import
# another measurement module by the same package path it hands to a
# subprocess: e05_workers launches uvicorn with the import string
# "measure.e05_app:app", which resolves against code/, and then imports
# `measure.e05_app` itself so that one module has one spelling. Without
# this, rooting the environment at measure/ takes code/ off the search
# path and that absolute import stops resolving.
[[tool.pyright.executionEnvironments]]
root = "measure"
extraPaths = ["ch10", "ch13", "."]

[[tool.pyright.executionEnvironments]]
root = "."

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

# ============================================================
#  code/ -- every listing, every exercise and every measurement in the book,
#  as one uv project locked to the versions on the title page.
#
#  The pins here are the SAME versions preamble.tex prints; the build's
#  `versions` job compares both against PyPI on every push, and
#  tools/check_structure.py --pins fails when the two disagree with each
#  other. Change a version in both places or in neither.
#
#  Run from this directory:
#      uv sync --locked          # the environment, exactly as CI has it
#      PYBOOK_SOLUTIONS=1 uv run pytest   # every listing, every exercise SOLUTION
#      PYBOOK_STARTERS=fail uv run pytest exercises   # every starter must fail
#      uv run ruff check .       # lint, 79 columns, because the page is
#      uv run pyright            # the checker the book pins first
# ============================================================
# --8<-- [start:project]
[project]
name = "python-for-dotnet-engineers"
version = "0.1.0.dev0"
description = "Listings, exercises and measurements for Python for .NET Engineers"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sqlalchemy==2.0.52",
    "alembic==1.20.0",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "opentelemetry-sdk==1.44.0",
    "polars==1.44.2",
    "anthropic==1.5.0",
    "openai==3.13.0",
]
# --8<-- [end:project]

# --8<-- [start:groups]
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.168.0",
    "coverage==7.16.1",
    "ruff==0.16.7",
    "pyright==1.1.414",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
]
# --8<-- [end:groups]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# The one package this project builds is the guiding project. Listings and
# exercises are plain files, run by tests, and are not packaged.
[tool.uv.build-backend]
module-name = "trace_assert"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "exercises"]
# "." makes `exercises` and `trace_assert` importable. A chapter directory
# is listed as well when that chapter's EXERCISES import its example modules
# -- ch11's do, because the exercise about fixtures is about the basket the
# chapter already built, and duplicating it into exercises/ would be two
# copies of the thing the exercise is about removing a copy of. Add an entry
# when a chapter needs one, and note that these directories share one flat
# namespace: two chapters cannot both put `pricing.py` on this list.
pythonpath = [".", "ch11"]
asyncio_mode = "auto"
addopts = "-q"
# An unregistered marker is nearly always a typo, and a typo'd marker is a
# test that quietly never runs under the filter meant to select it. pytest
# warns about one; this list is what makes the warning mean something.
markers = ["slow: deselect with -m 'not slow'"]

[tool.ruff]
# 79, not 88: that is what fits a listing on the page at \footnotesize without
# wrapping, and tools/check_structure.py --lines holds every file here to it.
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "ch*", "measure", "tests", "exercises"]
# Mirrors [tool.pytest.ini_options] pythonpath: pyright does not read
# that key, so a chapter directory an exercise imports from has to be
# listed in BOTH or the type-check fails on an import the tests
# resolve perfectly well. Keep the two lists in step.
extraPaths = ["ch11"]
# "ch*" rather than the exact chapter list, deliberately: pyright's
# glob matches ch00 through ch14 as they arrive. A hard-coded "ch00"
# left every future chapter's listings out of strict type-checking
# while the CI step stayed green -- proved on a scratch ch01/probe.py.

# A measurement script imports the chapter's own listings rather than a
# copy of them, and a listing is a SCRIPT: it imports its siblings by bare
# name, which is what the reader typing `uv run python ch10/nplusone.py`
# gets. pyright searches the file's own directory, so that resolves inside
# ch10/ and not from measure/. This names the chapter directories the
# measurement scripts reach into; add one when a chapter's measurement
# does -- ch13 is here because E8 times the corpus that ch13's
# what_survives.py prints, rather than carrying a second copy of it.
[[tool.pyright.executionEnvironments]]
root = "measure"
# "src" as well as the chapter directories: an executionEnvironment
# REPLACES the default resolution for files under its root, so naming only
# a chapter here took `src` off pyright's path for every measurement
# script. measure/suite_cost.py imports the guiding project by inserting
# `src` on sys.path, and this is the same statement made to the checker --
# without it pyright reports `"ASSERTIONS" is unknown import symbol` for a
# name that resolves perfectly at runtime, which is a config gap wearing a
# type error's clothes. Found by merging two chapters' passes together.
extraPaths = ["ch10", "ch13", "src"]

[[tool.pyright.executionEnvironments]]
root = "."

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
